name: Green Shop CI

on:
  push:
    branches: ["tuan-2", "tuan-3", "tuan-4", "tuan-5", "tuan-6", "tuan-7", "main"]

  pull_request:
    branches: ["tuan-2", "tuan-3", "tuan-4", "tuan-5", "tuan-6", "tuan-7", "main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-and-codeceptjs:
    name: Django Check and CodeceptJS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Django
        run: python manage.py check

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Seed test data
        run: |
          python manage.py seed_bva_orders
          python manage.py seed_cart_test

      - name: Run Django and CodeceptJS
        env:
          CI: "true"
        run: |
          python manage.py runserver 127.0.0.1:8000 > django.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Django server is ready"
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
          echo "Login page HTTP status: $(curl -s -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:8000/accounts/login/)"
          grep -c 'name="username"' /tmp/login.html || true
          npx codeceptjs run --steps

      - name: Show Django log on failure
        if: failure()
        run: tail -n 120 django.log || true