$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: GET
scripts:
  - type: afterResponse
    code: "function decode(value) { return String(value).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#([0-9]+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&quot;/g,'\"').replace(/&#x27;|&apos;/g,\"'\").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'); }\n\nfunction attr(tag, key) { const m = tag.match(new RegExp('(?:^|\\\\s)'+key+'=[\"\\x27]([^\"\\x27]*)[\"\\x27]','i')); return m ? decode(m[1]) : null; }\n\nfunction input(html, name) { return (html.match(/<input\\b[^>]*>/gi)||[]).find(tag=>attr(tag,'name')===name) || null; }\n\nfunction value(html,name) { const tag=input(html,name); if(!tag) throw new Error('Missing input '+name); return attr(tag,'value') || ''; }\n\npm.test('HTTP 200',()=>pm.response.to.have.status(200));\npm.test('Lưu đúng username và email',()=>{const h=pm.response.text();const tag=(h.match(/<input\b[^>]*>/gi)||[]).find(t=>attr(t,'id')==='id_username_display');pm.expect(tag).to.not.be.undefined;pm.expect(attr(tag,'value')).to.eql(pm.collectionVariables.get('bva_user'));pm.expect(value(h,'email')).to.eql(pm.collectionVariables.get('bva_email'));});"
    language: text/javascript
settings:
  followRedirects: false
order: 5000
