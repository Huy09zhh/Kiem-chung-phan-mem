$kind: http-request
name: "TC-AOA-013: Đối chiếu tổng số đơn và cơ cấu đơn hàng"
url: "{{base_url}}/admin-panel/dashboard/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-013: Status 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('TC-AOA-013: Có khối Tổng số đơn hàng & Cơ cấu đơn hàng', function () {
          const text = pm.response.text();
          pm.expect(text).to.include('Tổng số đơn hàng');
          pm.expect(text).to.include('Cơ cấu đơn hàng');
      });
    language: text/javascript
settings: {}
order: 2000
