$kind: http-request
name: "TC-AOA-014: Đối chiếu Tổng doanh thu thực tế"
url: "{{base_url}}/admin-panel/dashboard/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-014: Status 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('TC-AOA-014: Hiển thị khối Tổng doanh thu', function () {
          pm.expect(pm.response.text()).to.include('Tổng doanh thu');
      });
    language: text/javascript
settings: {}
order: 3000
