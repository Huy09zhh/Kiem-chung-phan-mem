$kind: http-request
name: "TC-DT-01 [Rule R1] Hợp lệ có giảm giá (old_price > price, sale 20%)"
url: "{{base_url}}/admin-panel/products/create/"
method: POST
body:
  type: urlencoded
  content:
    name: "Cà rốt Đà Lạt"
    price: "80000"
    old_price: "100000"
    category: "{{category_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Chuyển hướng thành công (Status 302)', function () {
          pm.expect(pm.response.code).to.eql(302);
      });
settings:
  followRedirects: false
order: 1000
