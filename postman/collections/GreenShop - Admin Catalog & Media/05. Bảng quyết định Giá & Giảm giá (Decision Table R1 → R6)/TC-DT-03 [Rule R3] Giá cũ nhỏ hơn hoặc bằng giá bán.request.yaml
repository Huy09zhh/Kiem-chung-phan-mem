$kind: http-request
name: "TC-DT-03 [Rule R3] Giá cũ <= Giá bán bị chặn"
url: "{{base_url}}/admin-panel/products/create/"
method: POST
body:
  type: urlencoded
  content:
    name: "Sản phẩm lỗi giá"
    price: "100000"
    old_price: "90000"
    category: "{{category_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Bị chặn ở form (Status 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Hiển thị thông báo lỗi: Giá cũ phải lớn hơn giá bán', function () {
          pm.expect(pm.response.text()).to.include('Giá cũ phải lớn hơn giá bán');
      });
order: 3000
