$kind: http-request
name: "00.1 — GET Trang đăng nhập (Lấy CSRF token)"
url: "{{base_url}}/accounts/login/"
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Mở trang đăng nhập thành công (HTTP 200)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('CSRF cookie được thiết lập', function () {
          var token = pm.cookies.get('csrftoken') || pm.response.cookies.get('csrftoken');
          pm.expect(token).to.not.be.undefined;
          pm.collectionVariables.set('csrf_token', token);
      });
order: 1000
