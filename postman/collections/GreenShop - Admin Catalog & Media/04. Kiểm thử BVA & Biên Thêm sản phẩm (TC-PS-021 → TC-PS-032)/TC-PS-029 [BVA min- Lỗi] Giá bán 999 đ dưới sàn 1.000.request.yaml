$kind: http-request
name: "TC-PS-029 [BVA min- Lỗi] Giá bán 999 đ dưới sàn 1.000 đ"
url: "{{base_url}}/admin-panel/products/create/"
method: POST
body:
  type: urlencoded
  content:
    name: "Rau Mầm Hướng Dương"
    price: "999"
    old_price: "70000"
    category: "{{category_id}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code 200 (Form báo lỗi)', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Trang báo lỗi: Giá bán tối thiểu là 1.000 VNĐ', function () {
          pm.expect(pm.response.text()).to.include('Giá bán tối thiểu là 1.000 VNĐ');
      });
settings:
  followRedirects: false
order: 9000
