$kind: http-request
name: "TC-BVA-015 Góp ý: Họ tên 120 ký tự; mức hài lòng 5; các trường khác hợp lệ"
url: "{{base_url}}/contact/"
method: POST
body:
  type: urlencoded
  content:
    form_type: feedback
    name: "{{bva_name}}"
    email: "{{bva_email}}"
    category: tong_the
    satisfaction: "{{bva_sat}}"
    message: "{{bva_message}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('bva_name', 'A'.repeat(120)); pm.collectionVariables.set('bva_email', ''); pm.collectionVariables.set('bva_sat', '5'); pm.collectionVariables.set('bva_message', 'Kiểm thử giá trị biên');
    language: text/javascript
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
      const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
      const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
      const loc = () => pm.response.headers.get('Location') || '';
      const cv = (k) => pm.collectionVariables.get(k);
      const setcv = (k, v) => pm.collectionVariables.set(k, v);
      const selectedStatus = () => grab(/<option value="(\w+)"\s+selected>/);
      const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

      pm.test("TC-BVA-015 | B11, B13", function () {
      ok(pm.response.code < 500, 'Server lỗi ' + pm.response.code);
      ok(pm.response.code === 302 && loc().indexOf('feedback_success=1') >= 0, 'Mong đợi 302 về ?feedback_success=1, nhận ' + pm.response.code + ' ' + loc());
      });
    language: text/javascript
settings:
  followRedirects: false
order: 4000
