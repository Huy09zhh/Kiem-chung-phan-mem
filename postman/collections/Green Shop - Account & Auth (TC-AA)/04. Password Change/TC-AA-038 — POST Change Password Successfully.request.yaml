$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: "{{aa_password}}"
    new_password1: "{{new_password}}"
    new_password2: "{{new_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Valid password change redirects to profile', () => pm.response.to.have.status(302));\r\npm.test('Location points to profile', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/accounts/profile/'));\nif (pm.response.code === 302) { const o = pm.collectionVariables.get('aa_password'); pm.collectionVariables.set('aa_password', pm.collectionVariables.get('new_password')); pm.collectionVariables.set('new_password', o); }"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user('/accounts/password/change/');   // điều kiện: đăng nhập tài khoản A + CSRF mới của /accounts/password/change/\npm.collectionVariables.set('aa_old_password', pm.collectionVariables.get('aa_password'));"
    language: text/javascript
settings:
  followRedirects: false
order: 7000
