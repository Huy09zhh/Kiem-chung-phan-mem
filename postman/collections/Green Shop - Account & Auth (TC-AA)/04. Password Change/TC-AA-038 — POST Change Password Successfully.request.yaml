$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
description: "Lớp EP: V – mọi lớp hợp lệ của đổi mật khẩu (V14, V15)."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: "{{c_old}}"
    new_password1: "{{c_new1}}"
    new_password2: "{{c_new2}}"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location là /accounts/profile/', () => pm.expect(loc).to.eql('/accounts/profile/'));\nhasSession((s) => pm.test('Vẫn đăng nhập (giữ phiên)', () => pm.expect(s).to.be.true));\nconst aa = eval(pm.collectionVariables.get('aa_helpers'));\naa.login(pm.collectionVariables.get('ep_user'), pm.variables.get('new_password'), null, () => hasSession((s) => pm.test('Đăng nhập được bằng mật khẩu mới', () => pm.expect(s).to.be.true)));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.newUser('/accounts/password/change/', function () { pm.collectionVariables.set('c_old', pm.variables.get('aa_password')); pm.collectionVariables.set('c_new1', pm.variables.get('new_password')); pm.collectionVariables.set('c_new2', pm.variables.get('new_password')); });"
    language: text/javascript
settings:
  followRedirects: false
order: 7000
