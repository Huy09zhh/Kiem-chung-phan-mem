$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: GET
description: "Lớp EP: V – đã đăng nhập mở form đổi mật khẩu."
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('Form có trường mật khẩu cũ', () => pm.expect(pm.response.text()).to.include('old_password'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.newUser(null);"
    language: text/javascript
settings:
  followRedirects: false
order: 1000
