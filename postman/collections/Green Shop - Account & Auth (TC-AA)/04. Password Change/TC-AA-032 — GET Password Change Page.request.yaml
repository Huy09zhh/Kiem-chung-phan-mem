$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Password change page returns 200', () => pm.response.to.have.status(200));\r\nconst html = pm.response.text();\r\npm.test('Password change form is present', () => pm.expect(html).to.include('name=\"old_password\"'));\r\nconst match = html.match(/name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"/);\r\nif (match) pm.collectionVariables.set('csrf_token', match[1]);"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user('/accounts/password/change/');   // điều kiện: đăng nhập tài khoản A + CSRF mới của /accounts/password/change/"
    language: text/javascript
settings: {}
order: 1000
