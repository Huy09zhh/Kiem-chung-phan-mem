$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: wrong-old-password
    new_password1: NewPass-For-Test-Only-1!
    new_password2: DifferentPass-For-Test-Only-2!
scripts:
  - type: afterResponse
    code: pm.test('Mismatched passwords remain on form', () => pm.response.to.have.status(200));
    language: text/javascript
settings:
  followRedirects: false
order: 5000
