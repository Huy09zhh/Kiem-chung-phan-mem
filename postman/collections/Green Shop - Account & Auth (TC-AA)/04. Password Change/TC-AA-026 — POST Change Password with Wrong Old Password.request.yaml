$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: wrong-old-password
    new_password1: "{{new_password}}"
    new_password2: "{{new_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Wrong old password stays on form', () => pm.response.to.have.status(200));\r

      pm.test('Password error is shown', () => pm.expect(pm.response.text()).to.include('old_password'));"
    language: text/javascript
settings:
  followRedirects: false
order: 4000
