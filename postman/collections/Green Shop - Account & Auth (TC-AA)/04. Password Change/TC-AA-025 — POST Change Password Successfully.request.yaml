$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: "{{reset_password}}"
    new_password1: "{{new_password}}"
    new_password2: "{{new_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Valid password change redirects to profile', () => pm.response.to.have.status(302));\r

      pm.test('Location points to profile', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/accounts/profile/'));"
    language: text/javascript
settings:
  followRedirects: false
order: 3000
