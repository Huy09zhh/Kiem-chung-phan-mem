$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Password change page returns 200', () => pm.response.to.have.status(200));\r

      const html = pm.response.text();\r

      pm.test('Password change form is present', () => pm.expect(html).to.include('name=\"old_password\"'));\r

      const match = html.match(/name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"/);\r

      if (match) pm.collectionVariables.set('csrf_token', match[1]);"
    language: text/javascript
settings: {}
order: 1000
