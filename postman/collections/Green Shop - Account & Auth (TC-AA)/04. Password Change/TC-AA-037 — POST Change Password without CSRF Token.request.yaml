$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    old_password: "wrong-old-password"
    new_password1: "NewPass-For-Test-Only-1!"
    new_password2: "NewPass-For-Test-Only-1!"
scripts:
  - type: afterResponse
    code: "pm.test('POST without CSRF is rejected', () => pm.response.to.have.status(403));\r\npm.test('CSRF failure is reported', () => pm.expect(pm.response.text()).to.include('CSRF'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user();   // điều kiện: đăng nhập tài khoản A"
    language: text/javascript
settings:
  followRedirects: false
order: 6000
