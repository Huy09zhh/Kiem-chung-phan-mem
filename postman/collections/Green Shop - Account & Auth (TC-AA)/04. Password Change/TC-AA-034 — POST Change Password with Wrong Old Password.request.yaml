$kind: http-request
url: "{{base_url}}/accounts/password/change/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    old_password: "wrong-old-password"
    new_password1: "{{new_password}}"
    new_password2: "{{new_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Wrong old password stays on form', () => pm.response.to.have.status(200));\r\npm.test('Password error is shown', () => pm.expect(pm.response.text()).to.include('old_password'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user('/accounts/password/change/');   // điều kiện: đăng nhập tài khoản A + CSRF mới của /accounts/password/change/"
    language: text/javascript
settings:
  followRedirects: false
order: 3000
