$kind: http-request
url: "{{base_url}}/accounts/logout/"
method: POST
description: "Lớp EP: V – Admin đăng xuất."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location là /', () => pm.expect(loc).to.eql('/'));\nhasSession((s) => pm.test('Phiên đã bị xóa', () => pm.expect(s).to.be.false));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.admin('/accounts/password/change/');"
    language: text/javascript
settings:
  followRedirects: false
order: 6000
