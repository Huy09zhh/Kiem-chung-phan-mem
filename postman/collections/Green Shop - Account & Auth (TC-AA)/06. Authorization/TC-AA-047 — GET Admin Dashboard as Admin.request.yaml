$kind: http-request
url: "{{base_url}}/accounts/admin-dashboard/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Admin dashboard returns 200 for admin', () => pm.response.to.have.status(200));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.admin();   // điều kiện: đăng nhập Admin"
    language: text/javascript
settings:
  followRedirects: false
order: 4000
