$kind: http-request
url: "{{base_url}}/accounts/login/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Trả 302', () => pm.response.to.have.status(302));\npm.test('Chuyển về dashboard', () => pm.expect(pm.response.headers.get('Location') || '').to.match(/dashboard/));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.admin();   // điều kiện: đăng nhập Admin"
    language: text/javascript
settings:
  followRedirects: false
order: 5000
