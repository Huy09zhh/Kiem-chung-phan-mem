$kind: http-request
url: "{{base_url}}/admin-panel/dashboard/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Customer cannot access admin dashboard', () => pm.expect([302, 403]).to.include(pm.response.code));\r

      if (pm.response.code === 302) pm.test('Redirect target is provided', () => pm.expect(pm.response.headers.get('Location') || '').to.not.equal(''));"
    language: text/javascript
settings:
  followRedirects: false
order: 1000
