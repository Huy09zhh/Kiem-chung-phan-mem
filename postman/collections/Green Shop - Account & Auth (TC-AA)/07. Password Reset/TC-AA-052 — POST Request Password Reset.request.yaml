$kind: http-request
url: "{{base_url}}/accounts/password/reset/"
method: POST
description: "Lớp EP: V – email có tài khoản."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    email: "{{ep_email}}"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location là /accounts/password/reset/done/', () => pm.expect(loc).to.eql('/accounts/password/reset/done/'));\nconst aa = eval(pm.collectionVariables.get('aa_helpers'));\naa.mailLink(pm.collectionVariables.get('ep_email'), (hit) => pm.test('Đã gửi email đặt lại', () => pm.expect(hit).to.not.be.null));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.newUserGuest('/accounts/password/reset/');"
    language: text/javascript
settings:
  followRedirects: false
order: 2000
