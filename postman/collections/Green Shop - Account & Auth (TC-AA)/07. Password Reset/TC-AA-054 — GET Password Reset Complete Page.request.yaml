$kind: http-request
url: "{{base_url}}/accounts/password/reset/complete/"
method: GET
description: "Lớp EP: V – trang hoàn tất đặt lại mật khẩu."
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('Hiện thông báo đã cập nhật mật khẩu', () => pm.expect(pm.response.text()).to.include('Mật khẩu đã được cập nhật'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest(null);"
    language: text/javascript
settings:
  followRedirects: true
order: 4000
