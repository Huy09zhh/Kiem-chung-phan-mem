$kind: http-request
url: "{{base_url}}/accounts/password/reset/{{reset_uid}}/set-password/"
method: POST
description: "Lớp EP: V – mật khẩu mới hợp lệ qua liên kết."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    new_password1: "{{s_pw1}}"
    new_password2: "{{s_pw2}}"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location chứa /accounts/password/reset/complete/', () => pm.expect(loc).to.include('/accounts/password/reset/complete/'));\nconst aa = eval(pm.collectionVariables.get('aa_helpers'));\naa.login(pm.collectionVariables.get('ep_user'), pm.variables.get('new_password'), null, () => hasSession((s) => pm.test('Đăng nhập được bằng mật khẩu mới', () => pm.expect(s).to.be.true)));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.startReset(function () { pm.collectionVariables.set('s_pw1', pm.variables.get('new_password')); pm.collectionVariables.set('s_pw2', pm.variables.get('new_password')); });"
    language: text/javascript
settings:
  followRedirects: false
order: 7000
