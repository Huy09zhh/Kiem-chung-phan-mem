$kind: http-request
url: "{{base_url}}/accounts/password/reset/{{reset_uid}}/{{reset_token}}/"
method: GET
description: "Lớp EP: X – liên kết đặt lại đã dùng."
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('Không còn form mật khẩu mới', () => pm.expect(pm.response.text()).to.not.include('new_password1'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.startReset(function () { aa.finishReset(); });"
    language: text/javascript
settings:
  followRedirects: true
order: 8000
