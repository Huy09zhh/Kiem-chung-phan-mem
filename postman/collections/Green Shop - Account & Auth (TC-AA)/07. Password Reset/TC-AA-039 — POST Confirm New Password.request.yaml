$kind: http-request
url: "{{base_url}}/accounts/password/reset/{{reset_uid}}/set-password/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    new_password1: "{{new_password}}"
    new_password2: "{{new_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Password reset redirects to completion', () => pm.response.to.have.status(302));\r

      pm.test('Location points to reset completion', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/accounts/password/reset/complete/'));"
    language: text/javascript
settings:
  followRedirects: false
order: 7000
