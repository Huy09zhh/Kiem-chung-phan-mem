$kind: http-request
url: "{{base_url}}/accounts/password/reset/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    email: "{{aa_email}}"
scripts:
  - type: afterResponse
    code: "pm.test('Reset request redirects', () => pm.response.to.have.status(302));\r

      pm.test('Redirects to reset confirmation', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/accounts/password/reset/done/'));"
    language: text/javascript
settings:
  followRedirects: false
order: 2000
