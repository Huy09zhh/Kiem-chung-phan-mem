$kind: collection
name: "PH1 - Account & Auth: TC-AA (Tiên)"
variables:
  base_url: ""
  csrf_token: ""
  aa_password: "AaTest#2026Aa!"
  new_password: "AaNew#2027Bb!"
  ep_user: ""
  ep_email: ""
  ep_b_user: ""
  ep_b_email: ""
  r_user: ""
  r_email: ""
  r_pw1: ""
  r_pw2: ""
  l_user: ""
  l_pw: ""
  l_next: ""
  p_first: ""
  p_last: ""
  p_email: ""
  c_old: ""
  c_new1: ""
  c_new2: ""
  s_pw1: ""
  s_pw2: ""
  reset_uid: ""
  reset_token: ""
  inactive_user: "tc_aa_inactive"
  inactive_pass: "AaInactive#2026Aa!"
  admin_user: "admin"
  admin_pass: "Admin@12345"
  aa_code_letters: '4'
  aa_helpers: "(function () {\n  // Quy tắc đặt tên dữ liệu thử: <tiền tố>_<mã TC>_<mã lượt chạy>. Mã lượt chạy gồm các chữ cái tăng dần, mỗi chữ theo sau là\n  // số thứ tự của nó trong bảng chữ cái (a1b2c3d4, D4E5G7K11), lấy theo phút chạy. Số chữ cái chỉnh bằng biến aa_code_letters (mặc định 4).\n  function binom(n, k) { if (k < 0 || k > n) { return 0; } var r = 1; for (var i = 1; i <= k; i++) { r = r * (n - k + i) / i; } return Math.round(r); }\n  function unrank(idx, n, k) {\n    var out = [], start = 0;\n    for (var i = 0; i < k; i++) {\n      for (var c = start; c < n; c++) { var cnt = binom(n - c - 1, k - i - 1); if (idx < cnt) { out.push(c); start = c + 1; break; } idx -= cnt; }\n    }\n    return out;\n  }\n  function runCode() {\n    var K = parseInt(pm.collectionVariables.get('aa_code_letters'), 10) || 4, total = binom(26, K), mi = Math.floor(Date.now() / 60000);\n    var upper = Math.floor(mi / total) % 2 === 1;\n    return unrank(mi % total, 26, K).map(function (c) { var L = String.fromCharCode(97 + c); return (upper ? L.toUpperCase() : L) + (c + 1); }).join('');\n  }\n  var seq = 0;\n  var aa = {\n    base: function () { return pm.variables.replaceIn('{{base_url}}'); },\n    uniq: function (p) { seq++; var m = String(pm.info.requestName || '').match(/TC-AA-(\\d+)/i); return p + '_TC' + (m ? m[1] : '') + '_' + runCode() + (seq > 1 ? '_' + seq : ''); },\n    tokenOf: function (html) {\n      var m = html.match(/name=[\"']csrfmiddlewaretoken[\"'][^>]*value=[\"']([^\"']+)[\"']/);\n      return m ? m[1] : '';\n    },\n    get: function (path, cb) {\n      pm.sendRequest({ url: aa.base() + path, method: 'GET' }, function (e, r) { cb(r); });\n    },\n    post: function (path, fields, cb) {\n      var body = Object.keys(fields).map(function (k) { return { key: k, value: fields[k] }; });\n      pm.sendRequest({ url: aa.base() + path, method: 'POST', body: { mode: 'urlencoded', urlencoded: body } }, function (e, r) { cb(r); });\n    },\n    // lấy CSRF mới của trang path và lưu vào biến csrf_token\n    token: function (path, cb) {\n      aa.get(path, function (r) { pm.collectionVariables.set('csrf_token', aa.tokenOf(r.text())); if (cb) { cb(); } });\n    },\n    // đưa phiên về Guest (đăng xuất nếu đang đăng nhập), rồi lấy CSRF của trang path\n    guest: function (path, cb) {\n      aa.get('/accounts/password/change/', function (r) {\n        aa.post('/accounts/logout/', { csrfmiddlewaretoken: aa.tokenOf(r.text()) }, function () {\n          if (path) { aa.token(path, cb); } else if (cb) { cb(); }\n        });\n      });\n    },\n    // đăng nhập bằng user/pass từ trạng thái Guest, rồi lấy CSRF của trang path\n    login: function (user, pass, path, cb) {\n      aa.guest('/accounts/login/', function () {\n        aa.post('/accounts/login/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), username: user, password: pass }, function () {\n          if (path) { aa.token(path, cb); } else if (cb) { cb(); }\n        });\n      });\n    },\n    admin: function (path, cb) { aa.login(pm.variables.get('admin_user'), pm.variables.get('admin_pass'), path, cb); },\n    // đăng ký một tài khoản Customer mới (lưu ep_user, ep_email), kết thúc ở trạng thái đã đăng nhập\n    newUser: function (path, cb) {\n      aa.guest('/accounts/register/', function () {\n        var u = aa.uniq('ep'), pw = pm.variables.get('aa_password');\n        pm.collectionVariables.set('ep_user', u); pm.collectionVariables.set('ep_email', u + '@example.test');\n        aa.post('/accounts/register/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), username: u, email: u + '@example.test', password1: pw, password2: pw }, function () {\n          if (path) { aa.token(path, cb); } else if (cb) { cb(); }\n        });\n      });\n    },\n    // tạo tài khoản mới rồi về Guest, lấy CSRF của trang path\n    newUserGuest: function (path, cb) { aa.newUser(null, function () { aa.guest(path, cb); }); },\n    // tạo một tài khoản khác (lưu ep_b_user, ep_b_email), dùng cho ca trùng username / email\n    other: function (cb) {\n      aa.guest('/accounts/register/', function () {\n        var u = aa.uniq('epb'), pw = pm.variables.get('aa_password');\n        pm.collectionVariables.set('ep_b_user', u); pm.collectionVariables.set('ep_b_email', u + '@example.test');\n        aa.post('/accounts/register/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), username: u, email: u + '@example.test', password1: pw, password2: pw }, function () { cb(); });\n      });\n    },\n    // đọc hộp thư phát triển (cần Admin là superuser) và tìm liên kết đặt lại gửi tới email; cb(null) nếu không có thư\n    mailLink: function (email, cb) {\n      aa.admin(null, function () {\n        aa.get('/dev/mailbox/', function (r) {\n          var hit = null;\n          r.text().split('<details').forEach(function (b) {\n            if (!hit && b.indexOf(email) !== -1) {\n              var m = b.match(/\\/accounts\\/password\\/reset\\/([^\\/\\s\"<]+)\\/([^\\/\\s\"<]+)\\//);\n              if (m) { hit = { uid: m[1], token: m[2] }; }\n            }\n          });\n          cb(hit);\n        });\n      });\n    },\n    // tạo tài khoản mới, yêu cầu đặt lại mật khẩu, mở liên kết trong thư; kết thúc ở Guest, đứng trên form mật khẩu mới\n    startReset: function (cb) {\n      aa.newUserGuest('/accounts/password/reset/', function () {\n        var email = pm.collectionVariables.get('ep_email');\n        aa.post('/accounts/password/reset/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), email: email }, function () {\n          aa.mailLink(email, function (hit) {\n            var uid = hit ? hit.uid : '', tok = hit ? hit.token : '';\n            pm.collectionVariables.set('reset_uid', uid); pm.collectionVariables.set('reset_token', tok);\n            aa.guest(null, function () {\n              aa.get('/accounts/password/reset/' + uid + '/' + tok + '/', function (r) {\n                pm.collectionVariables.set('csrf_token', aa.tokenOf(r.text())); cb();\n              });\n            });\n          });\n        });\n      });\n    },\n    // đặt mật khẩu mới trên form đặt lại (sau startReset), rồi về Guest\n    finishReset: function (cb) {\n      var pw = pm.variables.get('new_password');\n      aa.post('/accounts/password/reset/' + pm.collectionVariables.get('reset_uid') + '/set-password/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), new_password1: pw, new_password2: pw }, function () { aa.guest(null, cb); });\n    }\n  };\n  return aa;\n})()"
