$kind: http-request
url: "{{base_url}}/accounts/profile/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Guest is redirected from profile\", () => { pm.response.to.have.status(302); });\r

      pm.test(\"Redirect points to login\", () => { pm.expect(pm.response.headers.get(\"Location\") || \"\").to.include(\"/accounts/login/\"); });"
    language: text/javascript
settings:
  followRedirects: false
order: 2000
