$kind: http-request
url: "{{base_url}}/accounts/profile/"
method: GET
description: "Lớp EP: V – sau đăng xuất hồ sơ bị chặn (kiểm tra tiếp)."
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location chứa /accounts/login/', () => pm.expect(loc).to.include('/accounts/login/'));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.newUser('/accounts/password/change/', function () { aa.post('/accounts/logout/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token') }, function () {}); });"
    language: text/javascript
settings:
  followRedirects: false
order: 3000
