$kind: http-request
url: "{{base_url}}/accounts/login/"
method: POST
description: "Lớp EP: X – mật khẩu cũ sau khi đã đổi."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{l_user}}"
    password: "{{l_pw}}"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 200', () => pm.response.to.have.status(200));\npm.test('Hiện thông báo lỗi', () => pm.expect(pm.response.text()).to.match(/errorlist|auth-error/));\nhasSession((s) => pm.test('Mật khẩu cũ bị từ chối', () => pm.expect(s).to.be.false));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.newUser('/accounts/password/change/', function () { aa.post('/accounts/password/change/', { csrfmiddlewaretoken: pm.collectionVariables.get('csrf_token'), old_password: pm.variables.get('aa_password'), new_password1: pm.variables.get('new_password'), new_password2: pm.variables.get('new_password') }, function () { aa.guest('/accounts/login/', function () { pm.collectionVariables.set('l_user', pm.collectionVariables.get('ep_user')); pm.collectionVariables.set('l_pw', pm.variables.get('aa_password')); pm.collectionVariables.set('l_next', ''); }); }); });"
    language: text/javascript
settings:
  followRedirects: false
order: 5000
