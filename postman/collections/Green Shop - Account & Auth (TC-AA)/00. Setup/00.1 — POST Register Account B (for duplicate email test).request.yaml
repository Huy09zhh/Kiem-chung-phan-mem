$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{b_user}}"
    email: "{{b_email}}"
    password1: "{{aa_password}}"
    password2: "{{aa_password}}"
scripts:
  - type: afterResponse
    code: "pm.test('Đăng ký tài khoản B thành công', () => pm.response.to.have.status(302));\npm.test('Về trang chủ', () => pm.expect(pm.response.headers.get('Location') || '').to.match(/\\/$/));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/register/');   // điều kiện: Guest + CSRF mới của /accounts/register/\nconst id = Date.now();\npm.collectionVariables.set('b_user', `aab_${id}`);\npm.collectionVariables.set('b_email', `aab_${id}@example.test`);"
    language: text/javascript
settings:
  followRedirects: false
order: 1000
