$kind: http-request
url: "{{base_url}}/accounts/login/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Authenticated user is redirected from login\", () => { pm.response.to.have.status(302); });\r\npm.test(\"Redirects to home\", () => { pm.expect(pm.response.headers.get(\"Location\")).to.eql(\"/\"); });"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user();   // điều kiện: đăng nhập tài khoản A"
    language: text/javascript
settings:
  followRedirects: false
order: 10000
