$kind: http-request
url: "{{base_url}}/accounts/logout/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: afterResponse
    code: "pm.test('Trả 302', () => pm.response.to.have.status(302));\npm.test('Chuyển sang đăng nhập', () => pm.expect(pm.response.headers.get('Location') || '').to.match(/\\/accounts\\/login\\//));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/login/');   // điều kiện: Guest + CSRF mới của /accounts/login/"
    language: text/javascript
settings:
  followRedirects: false
order: 7000
