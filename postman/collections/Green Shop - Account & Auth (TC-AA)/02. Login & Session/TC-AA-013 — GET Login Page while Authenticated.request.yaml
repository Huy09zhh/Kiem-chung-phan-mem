$kind: http-request
url: "{{base_url}}/accounts/login/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Authenticated user is redirected from login\", () => { pm.response.to.have.status(302); });\r

      pm.test(\"Redirects to home\", () => { pm.expect(pm.response.headers.get(\"Location\")).to.eql(\"/\"); });"
    language: text/javascript
settings:
  followRedirects: false
order: 8000
