$kind: http-request
url: "{{base_url}}/accounts/login/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: ""
    password: ""
scripts:
  - type: afterResponse
    code: "pm.test(\"Empty credentials do not authenticate\", () => { pm.response.to.have.status(200); });\r

      pm.test(\"Login form remains visible\", () => { pm.expect(pm.response.text()).to.include(\"<title>Đăng nhập</title>\"); });"
    language: text/javascript
settings:
  followRedirects: false
order: 4000
