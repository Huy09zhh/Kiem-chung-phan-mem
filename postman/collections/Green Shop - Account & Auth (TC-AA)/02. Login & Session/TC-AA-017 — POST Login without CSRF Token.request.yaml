$kind: http-request
url: "{{base_url}}/accounts/login/"
method: POST
body:
  type: urlencoded
  content:
    username: "{{aa_username}}"
    password: "{{aa_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Login without CSRF is forbidden\", () => { pm.response.to.have.status(403); });\r\npm.test(\"CSRF rejection is reported\", () => { pm.expect(pm.response.text()).to.match(/CSRF/i); });"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/login/');   // điều kiện: Guest + CSRF mới của /accounts/login/"
    language: text/javascript
settings:
  followRedirects: false
order: 4000
