$kind: http-request
url: "{{base_url}}/accounts/profile/edit/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Profile edit page returns 200', () => pm.response.to.have.status(200));\r\nconst html = pm.response.text();\r\npm.test('Profile edit form is present', () => pm.expect(html).to.include('name=\"email\"'));\r\nconst match = html.match(/name=\"csrfmiddlewaretoken\" value=\"([^\"]+)\"/);\r\npm.test('CSRF token is present', () => pm.expect(match).to.not.be.null);\r\nif (match) pm.collectionVariables.set('csrf_token', match[1]);"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user('/accounts/profile/edit/');   // điều kiện: đăng nhập tài khoản A + CSRF mới của /accounts/profile/edit/"
    language: text/javascript
settings: {}
order: 1000
