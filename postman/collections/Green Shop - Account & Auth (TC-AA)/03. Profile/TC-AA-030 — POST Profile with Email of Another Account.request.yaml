$kind: http-request
url: "{{base_url}}/accounts/profile/edit/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    first_name: "Test"
    last_name: "Account"
    email: "{{b_email}}"
scripts:
  - type: afterResponse
    code: "pm.test('Trả 200 (ở lại biểu mẫu)', () => pm.response.to.have.status(200));\npm.test('Có lỗi email trùng', () => pm.expect(pm.response.text()).to.match(/Email này đã được sử dụng/));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user('/accounts/profile/edit/');   // điều kiện: đăng nhập tài khoản A + CSRF mới của /accounts/profile/edit/"
    language: text/javascript
settings:
  followRedirects: false
order: 5000
