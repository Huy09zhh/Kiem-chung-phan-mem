$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{case_username}}"
    email: "{{aa_email}}"
    password1: "{{aa_password}}"
    password2: "{{aa_password}}"
scripts:
  - type: beforeRequest
    code: "const id = Date.now();\r

      pm.collectionVariables.set(\"case_username\", `duplicate_email_${id}`);"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Duplicate email stays on registration form\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Duplicate email error appears\", () => {\r

      \  pm.expect(pm.response.text()).to.include(\"Email này đã được sử dụng\");\r

      });"
    language: text/javascript
settings: {}
order: 6000
