$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    username: "{{case_username}}"
    email: "{{case_email}}"
    password1: "{{aa_password}}"
    password2: "{{aa_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Registration without CSRF is forbidden\", () => { pm.response.to.have.status(403); });\r\npm.test(\"CSRF rejection is reported\", () => { pm.expect(pm.response.text()).to.match(/CSRF/i); });"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest();   // điều kiện: Guest\nconst id = Date.now();\r\npm.collectionVariables.set('case_username', 'aa_csrf_' + id);\r\npm.collectionVariables.set('case_email', 'aa_csrf_' + id + '@example.test');"
    language: text/javascript
settings: {}
order: 11000
