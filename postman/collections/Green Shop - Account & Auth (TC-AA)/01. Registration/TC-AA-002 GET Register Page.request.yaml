$kind: http-request
url: "{{base_url}}/accounts/register/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Registration page returns 200\", () => pm.response.to.have.status(200));\r

      \r

      const match = pm.response.text().match(\r

      \  /name=[\"']csrfmiddlewaretoken[\"'][^>]*value=[\"']([^\"']+)[\"']/\r

      );\r

      pm.test(\"CSRF token exists\", () => pm.expect(match).to.not.be.null);\r

      if (match) pm.collectionVariables.set(\"csrf_token\", match[1]);"
    language: text/javascript
settings: {}
order: 2000
