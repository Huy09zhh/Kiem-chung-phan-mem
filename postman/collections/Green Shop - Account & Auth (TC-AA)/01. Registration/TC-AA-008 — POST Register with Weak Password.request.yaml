$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{case_username}}"
    email: "{{case_email}}"
    password1: "123"
    password2: "123"
scripts:
  - type: beforeRequest
    code: "const id = Date.now();\r

      pm.collectionVariables.set(\"case_username\", `weak_${id}`);\r

      pm.collectionVariables.set(\"case_email\", `weak_${id}@example.test`);"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Weak password stays on registration form\", () => { pm.response.to.have.status(200); });\r

      pm.test(\"Password validation error appears\", () => { pm.expect(pm.response.text()).to.match(/mật khẩu|password/i); });"
    language: text/javascript
settings: {}
order: 8000
