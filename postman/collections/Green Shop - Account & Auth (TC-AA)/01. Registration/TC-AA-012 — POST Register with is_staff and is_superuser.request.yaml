$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
description: "Lớp EP: X – gửi kèm is_staff, is_superuser."
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{r_user}}"
    email: "{{r_email}}"
    password1: "{{r_pw1}}"
    password2: "{{r_pw2}}"
    is_staff: "on"
    is_superuser: "on"
scripts:
  - type: afterResponse
    code: "const base = pm.variables.replaceIn('{{base_url}}');\nconst loc = pm.response.headers.get('Location') || '';\nconst hasSession = (cb) => pm.sendRequest({ url: base + '/accounts/password/change/', method: 'GET' }, (e, r) => cb(!e && r.text().indexOf('old_password') !== -1));\npm.test('HTTP 302', () => pm.response.to.have.status(302));\npm.test('Location là /', () => pm.expect(loc).to.eql('/'));\nhasSession((s) => pm.test('Tài khoản được tạo và tự đăng nhập', () => pm.expect(s).to.be.true));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\nconst id = aa.uniq('ep');\npm.collectionVariables.set('r_user', id);\npm.collectionVariables.set('r_email', id + '@example.test');\npm.collectionVariables.set('r_pw1', pm.variables.get('aa_password'));\npm.collectionVariables.set('r_pw2', pm.variables.get('aa_password'));\naa.guest('/accounts/register/');"
    language: text/javascript
settings:
  followRedirects: false
order: 12000
