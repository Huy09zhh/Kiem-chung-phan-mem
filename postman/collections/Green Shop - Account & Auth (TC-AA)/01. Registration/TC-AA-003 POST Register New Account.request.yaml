$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{aa_username}}"
    email: "{{aa_email}}"
    password1: "{{aa_password}}"
    password2: "{{aa_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Valid registration redirects\", () => {\r\n  pm.response.to.have.status(302);\r\n});\r\npm.test(\"Redirects to home\", () => {\r\n  pm.expect(pm.response.headers.get(\"Location\") || \"\").to.match(/\\/$/);\r\n});"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/register/');   // điều kiện: Guest + CSRF mới của /accounts/register/\nconst id = Date.now();\r\npm.collectionVariables.set(\"aa_username\", `aa_${id}`);\r\npm.collectionVariables.set(\"aa_email\", `aa_${id}@example.test`);"
    language: text/javascript
settings:
  followRedirects: false
order: 3000
