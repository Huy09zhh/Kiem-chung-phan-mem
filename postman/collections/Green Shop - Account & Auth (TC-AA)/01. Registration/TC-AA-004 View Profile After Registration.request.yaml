$kind: http-request
url: "{{base_url}}/accounts/profile/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Profile is accessible after registration\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Registered username appears\", () => {\r

      \  pm.expect(pm.response.text()).to.include(pm.collectionVariables.get(\"aa_username\"));\r

      });"
    language: text/javascript
settings: {}
order: 4000
