$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{case_username}}"
    email: "{{case_email}}"
    password1: "{{aa_password}}"
    password2: "DifferentPassword@2026"
scripts:
  - type: afterResponse
    code: "pm.test(\"Password mismatch stays on registration form\", () => {\r\n  pm.response.to.have.status(200);\r\n});\r\npm.test(\"Confirmation field is present\", () => {\r\n  pm.expect(pm.response.text()).to.include('name=\"password2\"');\r\n});"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/register/');   // điều kiện: Guest + CSRF mới của /accounts/register/\nconst id = Date.now();\r\npm.collectionVariables.set(\"case_username\", `mismatch_${id}`);\r\npm.collectionVariables.set(\"case_email\", `mismatch_${id}@example.test`);"
    language: text/javascript
settings: {}
order: 8000
