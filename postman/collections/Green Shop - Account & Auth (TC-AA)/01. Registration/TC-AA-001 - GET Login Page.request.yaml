$kind: http-request
url: "{{base_url}}/accounts/login/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Login page returns 200\", () => pm.response.to.have.status(200));\r\n\r\nconst match = pm.response.text().match(\r\n  /name=[\"']csrfmiddlewaretoken[\"'][^>]*value=[\"']([^\"']+)[\"']/\r\n);\r\npm.test(\"CSRF token exists\", () => pm.expect(match).to.not.be.null);\r\nif (match) pm.collectionVariables.set(\"csrf_token\", match[1]);"
    language: text/javascript
settings: {}
order: 1000
