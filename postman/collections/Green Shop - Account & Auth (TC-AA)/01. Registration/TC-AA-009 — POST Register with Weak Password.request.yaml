$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{case_username}}"
    email: "{{case_email}}"
    password1: "123"
    password2: "123"
scripts:
  - type: afterResponse
    code: "pm.test(\"Weak password stays on registration form\", () => { pm.response.to.have.status(200); });\r\npm.test(\"Password validation error appears\", () => { pm.expect(pm.response.text()).to.match(/mật khẩu|password/i); });"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.guest('/accounts/register/');   // điều kiện: Guest + CSRF mới của /accounts/register/\nconst id = Date.now();\r\npm.collectionVariables.set(\"case_username\", `weak_${id}`);\r\npm.collectionVariables.set(\"case_email\", `weak_${id}@example.test`);"
    language: text/javascript
settings: {}
order: 9000
