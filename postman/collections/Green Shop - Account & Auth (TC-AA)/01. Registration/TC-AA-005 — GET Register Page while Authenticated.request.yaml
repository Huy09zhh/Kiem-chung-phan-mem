$kind: http-request
url: "{{base_url}}/accounts/register/"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test('Trả 302', () => pm.response.to.have.status(302));\npm.test('Về trang chủ', () => pm.expect(pm.response.headers.get('Location') || '').to.match(/\\/$/));"
    language: text/javascript
  - type: beforeRequest
    code: "const aa = eval(pm.collectionVariables.get('aa_helpers'));   // hàm dùng chung, xem biến aa_helpers\naa.user();   // điều kiện: đăng nhập tài khoản A"
    language: text/javascript
settings:
  followRedirects: false
order: 5000
