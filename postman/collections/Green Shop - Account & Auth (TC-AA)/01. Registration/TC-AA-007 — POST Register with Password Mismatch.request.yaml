$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    username: "{{case_username}}"
    email: "{{case_email}}"
    password1: "{{aa_password}}"
    password2: DifferentPassword@2026
scripts:
  - type: beforeRequest
    code: "const id = Date.now();\r

      pm.collectionVariables.set(\"case_username\", `mismatch_${id}`);\r

      pm.collectionVariables.set(\"case_email\", `mismatch_${id}@example.test`);"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Password mismatch stays on registration form\", () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Confirmation field is present\", () => {\r

      \  pm.expect(pm.response.text()).to.include('name=\"password2\"');\r

      });"
    language: text/javascript
settings: {}
order: 7000
