$kind: http-request
url: "{{base_url}}/admin-panel/orders/{{cancel_order_id}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
      const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
      const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
      const loc = () => pm.response.headers.get('Location') || '';
      const cv = (k) => pm.collectionVariables.get(k);
      const setcv = (k, v) => pm.collectionVariables.set(k, v);
      const selectedStatus = () => { const LBL = { 'Chờ xử lý': 'pending', 'Chờ chuyển khoản': 'awaiting_transfer', 'Đã thanh toán': 'paid', 'Thanh toán thất bại': 'failed', 'Đã xác nhận': 'confirmed', 'Đang giao': 'shipping', 'Hoàn thành': 'completed', 'Đã hủy': 'cancelled' }; const m = html.match(/Trạng thái hiện tại:\s*(?:<[^>]+>\s*)*([^<\n]+)/); if (m) { const k = m[1].trim(); if (LBL[k]) { return LBL[k]; } } return grab(/<option value="(\w+)"\s+selected>/); };
      const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

      pm.test("B.0 | Đơn #" + cv('cancel_order_id') + " đang ở Chờ xử lý (pending)", function () {
      ok(pm.response.code === 200, 'Không mở được đơn #' + cv('cancel_order_id') + ' (HTTP ' + pm.response.code + '). Kiểm tra cancel_order_id trong tab Variables.');
      const s = selectedStatus();
      ok(s === 'pending', 'Đơn #' + cv('cancel_order_id') + ' đang ở ' + (LABEL[s] || s) + '. Đặt cancel_order_id là một đơn đang Chờ xử lý rồi chạy lại.');
      });
    language: text/javascript
settings:
  followRedirects: false
order: 1000
