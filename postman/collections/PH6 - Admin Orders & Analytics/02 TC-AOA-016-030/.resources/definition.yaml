name: "02. TC-AOA-016 → 030"
order: 2000
description: |-
  Bộ kiểm thử tự động Sprint 2 cho phân hệ Admin Orders & Analytics (TC-AOA-016 đến 030).

  Cách chạy:
  1. Chạy server: python manage.py runserver
  2. Tab Variables: điền admin_password và customer_password.
  3. Luồng trạng thái đơn chỉ đi tiến và đơn ở trạng thái cuối bị khóa, nên mỗi lần chạy trọn bộ sẽ tiêu thụ đơn dùng cho test:
     - status_order_id: đơn chưa ở trạng thái cuối (TC-020/021 đẩy đơn lên 'Đã xác nhận' hoặc 'Đang giao').
     - paid_order_id: đơn đang 'Đã thanh toán', TC-023 sẽ HỦY đơn này.
     Chạy lại thì đổi hai biến sang đơn mới.
  4. Folder 04 phải chạy cuối vì nó đăng nhập bằng tài khoản khách.
