$kind: collection
name: PH6 - Admin Orders & Analytics (Quân)
description: |-
  Phân hệ 6: Admin Orders & Analytics (Nguyễn Lê Minh Quân).
  Gộp từ 8 collection cũ, mỗi collection cũ là một folder (01 → 08), giữ nguyên request và test.

  Cách chạy:
  1. python manage.py runserver
  2. Tab Variables: điền admin_password (và customer_password nếu folder cần tài khoản khách).
  3. Chạy Runner theo TỪNG folder, không chạy cả collection một lượt: mỗi folder có bước 00 đăng nhập riêng và dùng đơn hàng riêng.
  4. Hướng dẫn chi tiết của từng folder nằm trong phần mô tả folder đó.
