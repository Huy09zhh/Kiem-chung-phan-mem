$kind: http-request
url: '{{base_url}}/accounts/register/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    email: '{{bva_email}}'
    password1: '{{bva_password}}'
    password2: '{{bva_password}}'
scripts:
- type: beforeRequest
  code: |-
    const length = 150;
    const stamp = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    let username = "";
    if (length === 1) username = String.fromCodePoint(0x4e00 + Math.floor(Math.random() * 18000));
    else if (length === 2) username = String.fromCodePoint(0x4e00 + Math.floor(Math.random() * 18000)) + String.fromCodePoint(0x4e00 + Math.floor(Math.random() * 18000));
    else if (length > 0) username = ("u" + stamp + "x".repeat(length)).slice(0, length);
    pm.collectionVariables.set("bva_user", username);
    pm.collectionVariables.set("bva_email", "bva_" + stamp + "@example.test");
    pm.collectionVariables.set("bva_password", "Q7!mT2#x");
    if (username.length !== length) throw new Error("Sai độ dài username");
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test("BVA-AA-REG-USER-L150: ACCEPT - trả về 302", () => pm.response.to.have.status(302));
    pm.test("BVA-AA-REG-USER-L150: redirect về trang chủ", () => {
      pm.expect(pm.response.headers.get("Location") || "").to.match(/^\/($|\?)/);
    });
  language: text/javascript
settings:
  followRedirects: false
order: 2000
