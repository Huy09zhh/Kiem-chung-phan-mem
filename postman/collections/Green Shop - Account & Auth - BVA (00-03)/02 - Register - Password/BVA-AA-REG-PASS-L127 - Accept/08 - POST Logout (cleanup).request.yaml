$kind: http-request
url: '{{base_url}}/accounts/logout/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
scripts:
- type: afterResponse
  code: 'pm.test("CLEANUP: logout trả về 302", () => pm.response.to.have.status(302));'
  language: text/javascript
settings:
  followRedirects: false
order: 8000
