$kind: http-request
url: '{{base_url}}/accounts/login/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    password: '{{bva_password}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("BVA-AA-REG-PASS-L007: không đăng nhập được (200)", () => pm.response.to.have.status(200));
    pm.test("BVA-AA-REG-PASS-L007: tài khoản không tồn tại sau khi bị từ chối", () => {
      pm.expect(pm.response.text()).to.include("Please enter a correct username and password");
    });
  language: text/javascript
settings:
  followRedirects: false
order: 6000
