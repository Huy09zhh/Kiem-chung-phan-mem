$kind: http-request
name: "TC-AOA-015: Negative - Truy cập trang quản trị khi chưa đăng nhập"
url: "{{base_url}}/admin-panel/orders/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-015: Chặn truy cập và chuyển hướng về trang Đăng nhập', function () {
          const isRedirectedToLogin = pm.response.code === 302 || pm.response.text().includes('Đăng nhập');
          pm.expect(isRedirectedToLogin).to.be.true;
      });
    language: text/javascript
settings: {}
order: 5000
