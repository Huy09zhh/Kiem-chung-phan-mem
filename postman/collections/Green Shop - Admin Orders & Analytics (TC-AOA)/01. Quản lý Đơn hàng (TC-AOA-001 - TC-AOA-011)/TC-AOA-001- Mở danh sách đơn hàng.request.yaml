$kind: http-request
name: "TC-AOA-001: Mở danh sách đơn hàng"
url: "{{base_url}}/admin-panel/orders/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-001: Status 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('TC-AOA-001: Hiển thị tiêu đề Quản lý đơn hàng', function () {
          pm.expect(pm.response.text()).to.include('Quản lý đơn hàng');
      });
    language: text/javascript
settings: {}
order: 1000
