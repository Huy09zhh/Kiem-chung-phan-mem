$kind: http-request
name: "TC-AOA-006: Lọc đơn hàng theo trạng thái Chờ xử lý"
url: "{{base_url}}/admin-panel/orders/?status=pending"
method: GET
queryParams:
  status: pending
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-006: Status 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('TC-AOA-006: Bộ lọc status=pending được chọn', function () {
          pm.expect(pm.response.text()).to.include('Quản lý đơn hàng');
      });
    language: text/javascript
settings: {}
order: 6000
