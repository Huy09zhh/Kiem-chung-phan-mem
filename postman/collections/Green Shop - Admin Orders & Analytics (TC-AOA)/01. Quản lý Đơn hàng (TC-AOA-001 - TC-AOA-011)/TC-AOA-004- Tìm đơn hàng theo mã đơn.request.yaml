$kind: http-request
name: "TC-AOA-004: Tìm đơn hàng theo mã đơn"
url: "{{base_url}}/admin-panel/orders/?keyword=2"
method: GET
queryParams:
  keyword: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-AOA-004: Status 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('TC-AOA-004: Hiển thị đúng đơn hàng #2', function () {
          pm.expect(pm.response.text()).to.include('#2');
      });
    language: text/javascript
settings: {}
order: 4000
