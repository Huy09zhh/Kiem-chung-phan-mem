$kind: http-request
url: "{{base_url}}/admin/login/?next=/admin/"
method: POST
body:
  type: urlencoded
  content:
    username: "{{admin_username}}"
    password: "{{admin_password}}"
    next: "/admin/"
    csrfmiddlewaretoken: "{{csrf_token_val}}"
scripts:
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const cv = (k) => pm.collectionVariables.get(k);
      const loc = () => pm.response.headers.get('Location') || '';
      // Lấy id các dòng trong trang admin Đăng ký nhận tin có email trùng khớp chính xác
      const findIds = (page, email) => { const ids = []; const re = /newslettersubscriber\/(\d+)\/change\/[^"]*">([^<]*)<\/a>/g; let mm; while ((mm = re.exec(page))) { if (mm[2] === email) { ids.push(mm[1]); } } return ids; };
      const shown = () => ["Đăng ký nhận tin thành công. Cảm ơn bạn!", "Email này đã đăng ký nhận tin trước đó.", "Email không hợp lệ, vui lòng kiểm tra lại.", "Nếu email hợp lệ, chúng tôi đã gửi thư xác nhận. Vui lòng kiểm tra hộp thư để hoàn tất đăng ký.", "Bạn thao tác quá nhanh, vui lòng thử lại sau ít phút."].find((t) => html.includes(t)) || '(không có thông báo)';

      pm.test("SETUP | Đăng nhập admin thành công (302 → /admin/)", function () {
      ok(pm.response.code === 302 && loc().endsWith('/admin/'), 'HTTP ' + pm.response.code + ' – kiểm tra admin_username / admin_password trong tab Variables');
      });
    language: text/javascript
settings:
  followRedirects: false
order: 2000
