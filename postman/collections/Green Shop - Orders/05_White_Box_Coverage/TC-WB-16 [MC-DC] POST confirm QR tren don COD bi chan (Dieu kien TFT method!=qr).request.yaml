$kind: http-request
url: "{{base_url}}/orders/qr/{{wb_order_cod_id}}/confirm/"
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: |-
      var t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('TC-WB-16 | Confirm QR trên đơn COD bị chặn (payment_method!=qr)', function () {
        pm.expect([200, 302]).to.include(pm.response.code);
      });
      var t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }
    language: text/javascript
settings:
  followRedirects: false
order: 16000
