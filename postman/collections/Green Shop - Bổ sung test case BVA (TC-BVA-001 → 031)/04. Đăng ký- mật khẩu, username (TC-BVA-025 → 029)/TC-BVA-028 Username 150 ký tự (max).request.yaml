$kind: http-request
url: "{{base_url}}/accounts/register/"
method: POST
body:
  type: urlencoded
  content:
    username: "{{bva_user}}"
    email: "{{bva_email}}"
    password1: Xk7#mQ2p
    password2: Xk7#mQ2p
    csrfmiddlewaretoken: "{{csrf_token_val}}"
scripts:
  - type: beforeRequest
    code: const t = Date.now(); let u = ('u' + t + 'a'.repeat(150)).substring(0,150); pm.collectionVariables.set('bva_user', u); pm.collectionVariables.set('bva_email', 'bva' + t + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
      const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
      const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
      const loc = () => pm.response.headers.get('Location') || '';
      const cv = (k) => pm.collectionVariables.get(k);
      const setcv = (k, v) => pm.collectionVariables.set(k, v);
      const selectedStatus = () => grab(/<option value="(\w+)"\s+selected>/);
      const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

      pm.test("TC-BVA-028 | Username 150 ký tự (max)", function () {
      ok(pm.response.code < 500, 'Server lỗi ' + pm.response.code);
      ok(pm.response.code === 302, 'Mong đợi 302 (tạo tài khoản), nhận ' + pm.response.code);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 8000
