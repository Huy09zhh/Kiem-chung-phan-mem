$kind: http-request
name: '16. Thêm sản phẩm: Gộp tất cả tại min+ (TC-PS-022)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "ABC",
      "price": "1001",
      "description": "Tên 3 ký tự (min+), Giá bán 1.001 đ (min+), Giá cũ 50.002 đ (min+)",
      "old_price": "50002"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Tạo sản phẩm thành công (HTTP 201 Created)
    pm.test("[TC-PS-022] Tạo sản phẩm thành công (HTTP 201)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
    });
    pm.test("Kiểm tra dữ liệu phản hồi trả về đúng tên sản phẩm", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property("name");
    });
  language: text/javascript
settings:
  followRedirects: true
order: 16000
