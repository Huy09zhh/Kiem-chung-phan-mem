$kind: http-request
name: '23. Boundary: Giá bán 999 đ < min (TC-PS-029)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "Cây Bàng Singapore Mini",
      "price": "999",
      "description": "Giá bán 999 đ (< 1.000 đ min)",
      "old_price": "70000"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Hệ thống từ chối dữ liệu không hợp lệ (HTTP 400 Bad Request)
    pm.test("[TC-PS-029] Từ chối dữ liệu vi phạm biên (HTTP 400)", function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 422]);
    });
  language: text/javascript
settings:
  followRedirects: true
order: 23000
