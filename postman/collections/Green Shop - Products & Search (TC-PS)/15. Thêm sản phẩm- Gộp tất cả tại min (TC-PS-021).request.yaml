$kind: http-request
name: '15. Thêm sản phẩm: Gộp tất cả tại min (TC-PS-021)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "AB",
      "price": "1000",
      "description": "Tên 2 ký tự (min), Giá bán 1.000 đ (min), Giá cũ 50.001 đ (min)",
      "old_price": "50001"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Tạo sản phẩm thành công (HTTP 201 Created)
    pm.test("[TC-PS-021] Tạo sản phẩm thành công (HTTP 201)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
    });
    pm.test("Kiểm tra dữ liệu phản hồi trả về đúng tên sản phẩm", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property("name");
    });
  language: text/javascript
settings:
  followRedirects: true
order: 15000
