$kind: http-request
name: '25. Negative: Giá cũ <= Giá bán (TC-PS-031)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "Cây Trầu Bà Xanh Trồng Đất",
      "price": "50000",
      "description": "Giá cũ 50.000 đ bằng Giá bán 50.000 đ",
      "old_price": "50000"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Hệ thống từ chối dữ liệu không hợp lệ (HTTP 400 Bad Request)
    pm.test("[TC-PS-031] Từ chối dữ liệu vi phạm biên (HTTP 400)", function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 422]);
    });
  language: text/javascript
settings:
  followRedirects: true
order: 25000
