$kind: http-request
name: '17. Thêm sản phẩm: Gộp tất cả tại nominal (TC-PS-023)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "Cây Kim Tiền Để Bàn",
      "price": "50000",
      "description": "Tên 20 ký tự (nom), Giá bán 50.000 đ (nom), Giá cũ 70.000 đ (nom)",
      "old_price": "70000"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Tạo sản phẩm thành công (HTTP 201 Created)
    pm.test("[TC-PS-023] Tạo sản phẩm thành công (HTTP 201)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
    });
    pm.test("Kiểm tra dữ liệu phản hồi trả về đúng tên sản phẩm", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property("name");
    });
  language: text/javascript
settings:
  followRedirects: true
order: 17000
