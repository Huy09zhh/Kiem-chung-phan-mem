$kind: http-request
name: '19. Thêm sản phẩm: Gộp Giá bán max- & Giá cũ max (TC-PS-025)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "Cây Lưỡi Hổ Phong Thủy",
      "price": "99999999",
      "description": "Tên 20 ký tự, Giá bán 99.999.999 đ (max-), Giá cũ 100.000.000 đ (max)",
      "old_price": "100000000"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Tạo sản phẩm thành công (HTTP 201 Created)
    pm.test("[TC-PS-025] Tạo sản phẩm thành công (HTTP 201)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
    });
    pm.test("Kiểm tra dữ liệu phản hồi trả về đúng tên sản phẩm", function () {
        var jsonData = pm.response.json();
        pm.expect(jsonData).to.have.property("name");
    });
  language: text/javascript
settings:
  followRedirects: true
order: 19000
