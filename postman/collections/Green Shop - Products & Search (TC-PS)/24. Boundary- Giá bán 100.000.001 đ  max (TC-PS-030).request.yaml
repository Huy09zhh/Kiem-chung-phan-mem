$kind: http-request
name: '24. Boundary: Giá bán 100.000.001 đ > max (TC-PS-030)'
url: '{{baseUrl}}/products/api/'
method: POST
headers:
- key: Content-Type
  value: application/json
- key: Authorization
  value: Basic dGVzdF9hZG1pbjphZG1pbjEyMw==
body:
  type: json
  content: |-
    {
      "name": "Cây Cảnh Bonsai Nghệ Thuật",
      "price": "100000001",
      "description": "Giá bán 100.000.001 đ (> 100.000.000 đ max)",
      "old_price": "70000"
    }
scripts:
- type: afterResponse
  code: |-
    // Kỳ vọng: Hệ thống từ chối dữ liệu không hợp lệ (HTTP 400 Bad Request)
    pm.test("[TC-PS-030] Từ chối dữ liệu vi phạm biên (HTTP 400)", function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 422]);
    });
  language: text/javascript
settings:
  followRedirects: true
order: 24000
