$kind: collection
name: Green Shop - Admin Orders & Analytics (Chuyển trạng thái đơn TC-AOA-088 → 101)
description: |-
  Kiểm thử chuyển đổi trạng thái đơn hàng (TC-AOA-088 → 101), đã cập nhật theo luồng ALLOWED_TRANSITIONS (SCRUM-44, SCRUM-51).
  1. python manage.py runserver
  2. Điền admin_password và ba đơn mới:
     - flow_order_id: đơn đang Chờ xử lý (luồng A)
     - cancel_order_id: một đơn khác đang Chờ xử lý (luồng B)
     - qr_order_id: đơn đặt bằng chuyển khoản QR, đang Chờ chuyển khoản (luồng C)
  3. Run collection theo thứ tự folder 00 → 03. Bước A.0, B.0, C.0 báo FAIL nếu đơn không đúng trạng thái đầu.
  Sau mỗi lần chạy ba đơn đã chuyển trạng thái (A Hoàn thành, B Đã hủy, C Đã xác nhận), lần sau cần ba đơn mới.
variables:
  base_url: http://127.0.0.1:8000
  admin_username: adminquan
  admin_password: ""
  flow_order_id: "8"
  cancel_order_id: "10"
  qr_order_id: ""
  run_tag: ""
  csrf_html: ""
  csrf_token_val: ""
  csrf_cookie: ""
scripts:
  - type: http:beforeRequest
    code: |-
      // Tự thêm CSRF cho các request ghi dữ liệu (Django bắt buộc).
      const m = pm.request.method;
      pm.request.headers.upsert({ key: 'Referer', value: pm.variables.replaceIn('{{base_url}}') + '/' });
      if (m !== 'GET' && m !== 'HEAD') {
          const token = pm.collectionVariables.get('csrf_cookie') || pm.cookies.get('csrftoken') || pm.collectionVariables.get('csrf_html');
          if (token) {
              pm.request.headers.upsert({ key: 'X-CSRFToken', value: token });
              pm.collectionVariables.set('csrf_token_val', token);
          }
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Sau mỗi response: nhớ lại cookie csrftoken mới nhất (Django đổi token sau khi đăng nhập).
      let tk = null;
      try { tk = pm.cookies.get('csrftoken'); } catch (e) {}
      if (!tk) {
          try {
              const rc = pm.response.cookies.get('csrftoken');
              tk = rc && typeof rc === 'object' ? rc.value : rc;
          } catch (e) {}
      }
      if (tk) { pm.collectionVariables.set('csrf_cookie', tk); }
    language: text/javascript
