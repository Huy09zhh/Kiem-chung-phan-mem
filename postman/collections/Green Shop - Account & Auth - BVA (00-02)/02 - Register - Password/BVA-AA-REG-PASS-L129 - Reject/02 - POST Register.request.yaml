$kind: http-request
url: '{{base_url}}/accounts/register/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    email: '{{bva_email}}'
    password1: '{{bva_password}}'
    password2: '{{bva_password}}'
scripts:
- type: beforeRequest
  code: |-
    const length = 129;
    const stamp = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    // Mẫu gồm chữ hoa/thường/số/ký tự đặc biệt: không bị Common/Numeric/Similarity validator chặn,
    // nên kết quả chỉ phụ thuộc vào độ dài mật khẩu.
    const pattern = "Qv7!mT2#kZ9@rL4$wN6%";
    const password = pattern.repeat(Math.ceil(length / pattern.length)).slice(0, length);
    pm.collectionVariables.set("bva_user", "p" + stamp);
    pm.collectionVariables.set("bva_email", "bva_" + stamp + "@example.test");
    pm.collectionVariables.set("bva_password", password);
    if (password.length !== length) throw new Error("Sai độ dài password");
  language: text/javascript
- type: afterResponse
  code: |-
    const html = pm.response.text();
    pm.test("BVA-AA-REG-PASS-L129: REJECT - giữ lại form (200)", () => pm.response.to.have.status(200));
    pm.test("BVA-AA-REG-PASS-L129: hiển thị thông báo lỗi", () => {
      pm.expect(html).to.include('class="auth-error"');
    });
  language: text/javascript
settings:
  followRedirects: false
order: 2000
