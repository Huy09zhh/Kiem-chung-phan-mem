$kind: http-request
url: '{{base_url}}/accounts/login/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    password: '{{bva_password}}'
scripts:
- type: afterResponse
  code: |-
    pm.test("BVA-AA-REG-PASS-L008: đăng nhập lại thành công (302)", () => pm.response.to.have.status(302));
    pm.test("BVA-AA-REG-PASS-L008: mật khẩu 8 ký tự được lưu nguyên vẹn", () => {
      pm.expect(pm.response.headers.get("Location") || "").to.match(/^\/($|\?)/);
    });
  language: text/javascript
settings:
  followRedirects: false
order: 6000
