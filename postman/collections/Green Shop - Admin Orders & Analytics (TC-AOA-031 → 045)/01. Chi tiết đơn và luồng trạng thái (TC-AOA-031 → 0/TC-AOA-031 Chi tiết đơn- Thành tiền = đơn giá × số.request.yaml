$kind: http-request
name: 'TC-AOA-031 Chi tiết đơn: Thành tiền = đơn giá × số lượng'
url: '{{base_url}}/admin-panel/orders/{{order_id}}/'
method: GET
scripts:
- type: afterResponse
  code: |-
    const html = pm.response.text();
    const ok = (c, m) => { if (!c) { throw new Error(m); } };
    const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
    const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
    const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
    const loc = () => pm.response.headers.get('Location') || '';
    const cv = (k) => pm.collectionVariables.get(k);
    const setcv = (k, v) => pm.collectionVariables.set(k, v);
    const selectedStatus = () => grab(/<option value="(\w+)"\s+selected>/);
    const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

    pm.test("TC-AOA-031 | Mỗi dòng sản phẩm có Thành tiền = đơn giá × số lượng", function () {
    ok(pm.response.code === 200, 'HTTP ' + pm.response.code);

    const sec = html.split('Sản phẩm trong đơn')[1] || '';
    const tbl = (sec.match(/<table[\s\S]*?<\/table>/) || [''])[0];
    const rows = Array.from(tbl.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/g), (m) => Array.from(m[1].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/g), (c) => c[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()));
    const dataRows = rows.filter((r) => r.length >= 3 && /\d/.test(r[r.length - 1]) && !/Tổng/i.test(r.join(' ')) && !/Thành tiền/i.test(r.join(' ')));
    ok(dataRows.length > 0, 'Không đọc được dòng sản phẩm nào trong bảng Sản phẩm trong đơn');
    const bad = [];
    dataRows.forEach((r) => { const nums = r.map(num).filter((n) => !isNaN(n)); const last = nums[nums.length - 1]; const rest = nums.slice(0, -1); let hit = false; for (let i = 0; i < rest.length; i++) { for (let j = 0; j < rest.length; j++) { if (i !== j && rest[i] * rest[j] === last) { hit = true; } } } if (!hit) { bad.push(r.join(' | ')); } });
    ok(bad.length === 0, 'Thành tiền không bằng đơn giá × số lượng ở dòng: ' + bad.join(' ;; '));
    });
  language: text/javascript
settings:
  followRedirects: false
order: 1000
