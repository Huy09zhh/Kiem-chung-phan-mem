$kind: http-request
name: TC-AOA-042.2 Admin lưu Cài đặt (giữ nguyên giá trị)
url: '{{base_url}}/admin-panel/settings/'
method: POST
body:
  type: urlencoded
  content:
    x: y
scripts:
- type: beforeRequest
  code: |-
    const f = JSON.parse(pm.collectionVariables.get('settings_form') || '[]');
    pm.request.body.update({ mode: 'urlencoded', urlencoded: f.map((x) => ({ key: x[0], value: x[1] })).concat([{ key: 'csrfmiddlewaretoken', value: pm.collectionVariables.get('csrf_token_val') }]) });
  language: text/javascript
- type: afterResponse
  code: |-
    const html = pm.response.text();
    const ok = (c, m) => { if (!c) { throw new Error(m); } };
    const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
    const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
    const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
    const loc = () => pm.response.headers.get('Location') || '';
    const cv = (k) => pm.collectionVariables.get(k);
    const setcv = (k, v) => pm.collectionVariables.set(k, v);
    const selectedStatus = () => grab(/<option value="(\w+)"\s+selected>/);
    const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

    pm.test("TC-AOA-042 | POST hợp lệ lưu cấu hình, không lỗi", function () {
    ok(pm.response.code === 302 || pm.response.code === 200, 'Mong đợi 302/200, nhận ' + pm.response.code);
    ok(pm.response.code === 302 || /thành công|đã lưu|đã cập nhật/i.test(html), 'Không thấy thông báo lưu thành công và cũng không chuyển hướng');
    });
  language: text/javascript
settings:
  followRedirects: false
order: 3000
