$kind: http-request
name: TC-ORD-10 [BVA-max-] Checkout voi full_name 254 ky tu, phone 19 ky tu
url: "{{base_url}}/orders/checkout/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    full_name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    phone: "9999999999999999999"
    address: 123 Đường ABC, Phường 1, TP.HCM
    note: ""
    payment_method: cod
scripts:
  - type: beforeRequest
    code: |2-
        pm.sendRequest({ url: pm.collectionVariables.get('base_url') + '/cart/add/' + pm.collectionVariables.get('product_id') + '/', method: 'GET' }, function () {});
        const t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-ORD-10 | Biên max- (name 254, phone 19) tạo đơn thành công (302)', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
    language: text/javascript
settings:
  followRedirects: false
order: 5000
