$kind: http-request
url: "{{base_url}}/orders/checkout/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    full_name: Khách Giỏ Rỗng
    phone: "0901234567"
    address: Hà Nội
    payment_method: cod
scripts:
  - type: beforeRequest
    code: "  const t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }"
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-EG-01 | Giỏ rỗng không được tạo đơn -> 302 về /cart/', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
    language: text/javascript
settings:
  followRedirects: false
order: 1000
