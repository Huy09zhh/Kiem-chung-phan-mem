$kind: http-request
name: TC-EG-03 Gui trung lap POST Mock success 2 lan lien tiep (Idempotency)
url: "{{base_url}}/orders/mock/{{st_order_mock_success_id}}/success/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: "  const t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }"
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-EG-03 | Gửi Mock success lần 2 không gây crash 500 (trả về 302)', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
    language: text/javascript
settings:
  followRedirects: false
order: 3000
