$kind: http-request
name: TC-WB-08 [Branch] POST Checkout bo qua payment_method (Nhanh D7 True mac dinh COD)
url: "{{base_url}}/orders/checkout/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
    full_name: Nguyen Van A
    phone: "0901234567"
    address: 123 Le Loi
scripts:
  - type: beforeRequest
    code: |2-
        var sid = pm.cookies.get('sessionid');
        var csrf = pm.cookies.get('csrftoken');
        var cookieHdr = '';
        if (sid) { cookieHdr += 'sessionid=' + sid + '; '; }
        if (csrf) { 
          cookieHdr += 'csrftoken=' + csrf; 
          pm.collectionVariables.set('csrf_token', csrf);
        }
        pm.sendRequest({
          url: pm.collectionVariables.get('base_url') + '/cart/add/' + pm.collectionVariables.get('product_id') + '/',
          method: 'GET',
          header: { 'Cookie': cookieHdr }
        }, function (err, res) {});
        var t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-WB-08 | Không truyền payment_method -> mặc định COD tạo đơn thành công', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
        var t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }
    language: text/javascript
settings:
  followRedirects: false
order: 8000
