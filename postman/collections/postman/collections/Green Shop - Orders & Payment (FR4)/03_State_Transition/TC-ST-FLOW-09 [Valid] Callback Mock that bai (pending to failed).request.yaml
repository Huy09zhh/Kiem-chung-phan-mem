$kind: http-request
url: "{{base_url}}/orders/mock/{{st_order_mock_id}}/fail/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: "  const t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }"
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-ST-FLOW-09 | [Transition hợp lệ] Mock callback fail -> pending sang failed (302)', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
    language: text/javascript
settings:
  followRedirects: false
order: 9000
