$kind: http-request
name: TC-ST-INV-03 [Negative] Cancel QR tren don da paid (Chan huy don da thanh toan)
url: "{{base_url}}/orders/{{st_order_mock_success_id}}/cancel/"
method: POST
headers:
  X-CSRFToken: "{{csrf_token}}"
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: "{{csrf_token}}"
scripts:
  - type: beforeRequest
    code: "  const t = pm.cookies.get('csrftoken'); if (t) { pm.collectionVariables.set('csrf_token', t); }"
    language: text/javascript
  - type: afterResponse
    code: |2-
        pm.test('TC-ST-INV-03 | [Chặn chuyển sai] Không cho hủy đơn đã paid qua cancel QR (redirect 302, giữ paid)', function () {
          pm.expect([200, 302]).to.include(pm.response.code);
        });
    language: text/javascript
settings:
  followRedirects: false
order: 15000
