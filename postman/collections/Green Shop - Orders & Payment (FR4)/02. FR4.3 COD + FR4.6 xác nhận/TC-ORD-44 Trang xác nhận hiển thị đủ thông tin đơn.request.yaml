$kind: http-request
url: "{{base_url}}/orders/success/{{cod_order_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trang success 200', function () { pm.expect(pm.response.code).to.eql(200); });
      pm.test('TC-ORD-44 | Có mã đơn, người nhận, SĐT, địa chỉ, phương thức, trạng thái', function () {
        const h = pm.response.text();
        pm.expect(h).to.include(pm.collectionVariables.get('cod_order_id'));
        ['Trần Đình Đức','0901234567','12 Nguyễn Huệ','Thanh toán khi nhận hàng','Chờ xử lý'].forEach(s => pm.expect(h, 'Thiếu: ' + s).to.include(s));
      });
    language: text/javascript
order: 2000
