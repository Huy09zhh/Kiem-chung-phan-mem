$kind: http-request
url: "{{base_url}}/orders/qr/{{qr_order_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Trang QR 200', function () { pm.expect(pm.response.code).to.eql(200); });
      pm.test('TC-ORD-30 | Ảnh VietQR + nội dung THANH TOAN DH{id}', function () {
        const h = pm.response.text(); const id = pm.collectionVariables.get('qr_order_id');
        pm.expect(h).to.include('https://img.vietqr.io/image/');
        pm.expect(h).to.include('amount=');
        pm.expect(h).to.include('addInfo=THANH%20TOAN%20DH' + id);
        pm.expect(h).to.include('THANH TOAN DH' + id);
      });
    language: text/javascript
order: 2000
