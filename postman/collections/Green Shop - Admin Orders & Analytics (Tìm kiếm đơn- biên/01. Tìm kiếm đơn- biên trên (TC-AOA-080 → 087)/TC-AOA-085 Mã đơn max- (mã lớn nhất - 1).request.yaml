$kind: http-request
url: "{{base_url}}/admin-panel/orders/?keyword={{kw_max_minus1}}"
method: GET
queryParams:
  keyword: "{{kw_max_minus1}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('kw_max_minus1', String(parseInt(pm.collectionVariables.get('max_order_id'), 10) - 1));
    language: text/javascript
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const num = (s) => parseInt(String(s).replace(/[^\d]/g, ''), 10);
      const grab = (re) => { const m = html.match(re); return m ? m[1] : null; };
      const rowIds = () => Array.from(html.matchAll(/<td>#(\d+)<\/td>/g), (m) => parseInt(m[1], 10));
      const loc = () => pm.response.headers.get('Location') || '';
      const cv = (k) => pm.collectionVariables.get(k);
      const setcv = (k, v) => pm.collectionVariables.set(k, v);
      const selectedStatus = () => grab(/<option value="(\w+)"\s+selected>/);
      const LABEL = { pending: 'Chờ xử lý', awaiting_transfer: 'Chờ chuyển khoản', paid: 'Đã thanh toán', failed: 'Thanh toán thất bại', confirmed: 'Đã xác nhận', shipping: 'Đang giao', completed: 'Hoàn thành', cancelled: 'Đã hủy' };

      pm.test("TC-AOA-085 | Mã đơn max- (mã lớn nhất - 1)", function () {
      ok(pm.response.code === 200, 'HTTP ' + pm.response.code);
      ok(!/Server Error|Traceback/i.test(html), 'Trang báo lỗi máy chủ');
      const ids = rowIds();
      const all = JSON.parse(cv('order_ids_json') || '[]');
      const n = parseInt(cv('kw_max_minus1'), 10);
      if (all.indexOf(n) >= 0) { ok(ids.length === 1 && ids[0] === n, 'Mong đợi chỉ đơn #' + n + ', thực tế: [' + ids.join(', ') + ']'); } else { ok(ids.length === 0, 'Đơn #' + n + ' không tồn tại, mong đợi danh sách rỗng, thực tế: [' + ids.join(', ') + ']'); }
      });
    language: text/javascript
settings:
  followRedirects: false
order: 6000
