$kind: http-request
url: "{{base_url}}/cart/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const cv = (k) => pm.collectionVariables.get(k);
      const loc = () => pm.response.headers.get('Location') || '';
      const inCart = (id) => html.includes('/cart/remove/' + id + '/');
      const rows = (id) => html.split('/cart/remove/' + id + '/').length - 1;
      const qtyOf = (id) => { const m = html.match(new RegExp('/cart/decrease/' + id + '/"[^>]*>[^<]*</a>\\s*<span class="qty-number">(\\d+)</span>')); return m ? parseInt(m[1], 10) : null; };
      const total = () => { const m = html.match(/<div class="summary-total">([^<]+)<\/div>/); return m ? parseInt(m[1].replace(/[^\d]/g, ''), 10) : null; };

      pm.test("SETUP | Mở giỏ hàng user1 (200)", function () {
      ok(pm.response.code === 200, 'Mong đợi HTTP 200, thực tế ' + pm.response.code);
      });

      // Xóa mọi sản phẩm đang có trong giỏ bằng pm.sendRequest
      const base = pm.variables.replaceIn('{{base_url}}');
      const ids = [...new Set(Array.from(html.matchAll(/\/cart\/remove\/(\d+)\//g), (x) => x[1]))];
      ids.forEach((id) => pm.sendRequest(base + '/cart/remove/' + id + '/', () => {}));
    language: text/javascript
settings:
  followRedirects: false
order: 11000
