$kind: http-request
url: "{{base_url}}/products/api/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const html = pm.response.text();
      const ok = (c, m) => { if (!c) { throw new Error(m); } };
      const cv = (k) => pm.collectionVariables.get(k);
      const loc = () => pm.response.headers.get('Location') || '';
      const inCart = (id) => html.includes('/cart/remove/' + id + '/');
      const rows = (id) => html.split('/cart/remove/' + id + '/').length - 1;
      const qtyOf = (id) => { const m = html.match(new RegExp('/cart/decrease/' + id + '/"[^>]*>[^<]*</a>\\s*<span class="qty-number">(\\d+)</span>')); return m ? parseInt(m[1], 10) : null; };
      const total = () => { const m = html.match(/<div class="summary-total">([^<]+)<\/div>/); return m ? parseInt(m[1].replace(/[^\d]/g, ''), 10) : null; };

      pm.test("PRE | API sản phẩm trả 200 và có ít nhất 2 sản phẩm (chạy seed_test_data.py nếu fail)", function () {
      ok(pm.response.code === 200, 'Mong đợi HTTP 200, thực tế ' + pm.response.code);
      const list = pm.response.json().slice().sort((a, b) => a.id - b.id);
      ok(list.length >= 2, 'Cần ít nhất 2 sản phẩm, đang có ' + list.length);
      const setcv = (k, v) => pm.collectionVariables.set(k, String(v));
      setcv('min_id', list[0].id);
      setcv('max_id', list[list.length - 1].id);
      setcv('product_a', list[0].id);
      setcv('price_a', parseInt(list[0].price, 10));
      setcv('product_b', list[1].id);
      setcv('price_b', parseInt(list[1].price, 10));
      setcv('max_id_plus_1', list[list.length - 1].id + 1);
      setcv('max_id_plus_100', list[list.length - 1].id + 100);
      });
    language: text/javascript
settings:
  followRedirects: false
order: 3000
