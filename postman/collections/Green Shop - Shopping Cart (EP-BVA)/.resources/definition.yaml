$kind: collection
description: |-
  Kiểm thử hộp đen phân hệ FR3 - Giỏ hàng: Phân hoạch tương đương (TC-CART-EP-01 → 15) và Giá trị biên (TC-CART-BVA-01 → 15).
  Tài liệu: docs/TestCase_FR3_Cart_EP_BVA.md
  1. Chạy server: python manage.py runserver
  2. Tạo dữ liệu (1 lần): python manage.py shell -c "exec(open('postman/seed_test_data.py', encoding='utf-8').read())"
  3. Kiểm tra user1 / user2 trong tab Variables, rồi chạy Collection Runner theo thứ tự folder 00 → 02.
  Request [setup] chỉ chuẩn bị dữ liệu; request TC-xx.1 thực hiện thao tác, TC-xx.2 mở giỏ hàng để kiểm tra.
variables:
  base_url: "http://127.0.0.1:8000"
  user_username: "user1"
  user_password: "User@12345"
  user2_username: "user2"
  user2_password: "User@12345"
  product_a: ""
  product_b: ""
  price_a: ""
  price_b: ""
  min_id: ""
  max_id: ""
  csrf_html: ""
  csrf_token_val: ""
  csrf_cookie: ""
  max_id_plus_1: ""
  max_id_plus_100: ""
  min_plus_1: ""
  max_minus_1: ""
scripts:
  - type: http:beforeRequest
    code: |-
      // Tự thêm CSRF cho các request ghi dữ liệu (Django bắt buộc).
      const m = pm.request.method;
      pm.request.headers.upsert({ key: 'Referer', value: pm.variables.replaceIn('{{base_url}}') + '/' });
      if (m !== 'GET' && m !== 'HEAD') {
          const token = pm.collectionVariables.get('csrf_cookie') || pm.cookies.get('csrftoken') || pm.collectionVariables.get('csrf_html');
          if (token) {
              pm.request.headers.upsert({ key: 'X-CSRFToken', value: token });
              pm.collectionVariables.set('csrf_token_val', token);
          }
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Sau mỗi response: nhớ lại cookie csrftoken mới nhất (Django đổi token sau khi đăng nhập).
      let tk = null;
      try { tk = pm.cookies.get('csrftoken'); } catch (e) {}
      if (!tk) {
          try {
              const rc = pm.response.cookies.get('csrftoken');
              tk = rc && typeof rc === 'object' ? rc.value : rc;
          } catch (e) {}
      }
      if (tk) { pm.collectionVariables.set('csrf_cookie', tk); }
    language: text/javascript
