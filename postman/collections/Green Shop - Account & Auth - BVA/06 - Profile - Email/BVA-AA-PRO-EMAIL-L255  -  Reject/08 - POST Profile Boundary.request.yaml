$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    first_name: '{{bva_first_name}}'
    last_name: '{{bva_last_name}}'
    email: '{{bva_profile_value}}'
scripts:
  - type: beforeRequest
    code: |-
      const N={username:76,password:68,email:130,first_name:75,last_name:75};
      const seed=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
      function sized(prefix,n,fill='x') { return (prefix+fill.repeat(n)).slice(0,n); }
      function password(n,variant='old') { const pattern=variant==='new'?'V9!rK4#tY2@pL6$wN3%':'Q7!mT2#kZ9@rL4$wN6%'; return pattern.repeat(Math.ceil(n/pattern.length)).slice(0,n); }
      function username(n) { if(!n) return ''; if(n<3) return Array.from({length:n},()=>String.fromCodePoint(0x4e00+Math.floor(Math.random()*16000))).join(''); return sized('u'+seed,n); }
      function email(n,prefix='m') {
       if(!n) return ''; if(n===5) return 'a@b.c';
       if(n<70) { const pick=()=>String.fromCharCode(97+Math.floor(Math.random()*26)); if(n<8) return pick().repeat(n-5)+'@'+pick()+'.'+pick()+pick(); return sized(prefix+seed,n-13)+'@example.test'; }
       const local=sized(prefix+seed,64,'a'); let remaining=n-65-5; const labels=[];
       while(remaining>0) { let take=Math.min(63,remaining); if(remaining-take===1) take--; labels.push('d'.repeat(take)); remaining-=take; if(remaining>0) remaining--; }
       const result=local+'@'+labels.join('.')+'.test'; if(result.length!==n) throw new Error('Email length mismatch'); return result;
      }

      pm.collectionVariables.set('bva_profile_value',email(255,'e'));
      if(pm.collectionVariables.get('bva_profile_value').length!==255)throw new Error('Wrong boundary length');
    language: text/javascript
  - type: afterResponse
    code: |-
      function decode(value) { return String(value).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#([0-9]+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&quot;/g,'"').replace(/&#x27;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'); }

      function attr(tag, key) { const m = tag.match(new RegExp('(?:^|\\s)'+key+'=["\x27]([^"\x27]*)["\x27]','i')); return m ? decode(m[1]) : null; }

      function input(html, name) { return (html.match(/<input\b[^>]*>/gi)||[]).find(tag=>attr(tag,'name')===name) || null; }

      function fieldError(html,name) {
       const tag=input(html,name); if(!tag) return '';
       const id='id_'+name+'_error';
       const blocks=html.match(/<(?:ul|small|span)\b[^>]*(?:errorlist|auth-error)[^>]*>[\s\S]*?<\/(?:ul|small|span)>/gi)||[];
       const own=blocks.find(b=>b.includes(id)); if(own) return decode(own.replace(/<[^>]*>/g,' '));
       const after=html.slice(html.indexOf(tag)+tag.length).split(/<\/(?:div|p)>/i)[0];
       const error=after.match(/<(?:small|span|ul)\b[^>]*(?:auth-error|errorlist|color:\s*red)[^>]*>[\s\S]*?<\/(?:small|span|ul)>/i);
       return error ? decode(error[0].replace(/<[^>]*>/g,' ')) : '';
      }
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('Lỗi đúng trường và đúng nguyên nhân',()=>{const html=pm.response.text();const messages=["email"].map(f=>fieldError(html,f)).filter(Boolean);pm.expect(messages,'Không có lỗi gắn với trường đang kiểm tra').to.not.be.empty;pm.expect(messages.join(' ')).to.match(/at most 254|(?:quá|đa) 254|254 (?:characters|ký tự)/i);});
    language: text/javascript
settings:
  followRedirects: false
order: 8000
