$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: GET
scripts:
  - type: afterResponse
    code: |-
      function decode(value) { return String(value).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#([0-9]+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&quot;/g,'"').replace(/&#x27;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'); }

      function attr(tag, key) { const m = tag.match(new RegExp('(?:^|\\s)'+key+'=["\x27]([^"\x27]*)["\x27]','i')); return m ? decode(m[1]) : null; }
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('Đúng tài khoản',()=>{const h=pm.response.text();const tag=(h.match(/<input\b[^>]*>/gi)||[]).find(t=>attr(t,'id')==='id_username_display');pm.expect(tag).to.not.be.undefined;pm.expect(attr(tag,'value')).to.eql(pm.collectionVariables.get('bva_user'));});
    language: text/javascript
settings:
  followRedirects: false
order: 19000
