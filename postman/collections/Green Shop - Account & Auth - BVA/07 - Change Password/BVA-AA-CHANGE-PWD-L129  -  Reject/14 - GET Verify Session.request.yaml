$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: GET
scripts:
  - type: afterResponse
    code: |-
      function locationPath() { const loc=pm.response.headers.get('Location')||''; return loc.replace(/^https?:\/\/[^/]+/i,'').split('?')[0]; }
      pm.test('Không có phiên đăng nhập',()=>pm.response.to.have.status(302)); pm.test('Yêu cầu đăng nhập',()=>pm.expect(locationPath()).to.eql('/accounts/login/'));
    language: text/javascript
settings:
  followRedirects: false
order: 14000
