$kind: http-request
url: '{{base_url}}/accounts/login/'
method: GET
scripts:
  - type: afterResponse
    code: |-
      function decode(value) { return String(value).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&#([0-9]+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&quot;/g,'"').replace(/&#x27;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'); }

      function attr(tag, key) { const m = tag.match(new RegExp('(?:^|\\s)'+key+'=["\x27]([^"\x27]*)["\x27]','i')); return m ? decode(m[1]) : null; }

      function input(html, name) { return (html.match(/<input\b[^>]*>/gi)||[]).find(tag=>attr(tag,'name')===name) || null; }

      function value(html,name) { const tag=input(html,name); if(!tag) throw new Error('Missing input '+name); return attr(tag,'value') || ''; }

      function captureCsrf(html) {
       const token=value(html,'csrfmiddlewaretoken');
       pm.collectionVariables.unset('bva_csrf');
       pm.test('SETUP: lấy được CSRF',()=>pm.expect(token).to.be.a('string').and.not.empty);
       if(!token) throw new Error('Missing CSRF'); pm.collectionVariables.set('bva_csrf',token);
      }
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('Đúng form: username',()=>pm.expect(input(pm.response.text(),"username")).to.not.be.null);
      pm.test('Đúng form: password',()=>pm.expect(input(pm.response.text(),"password")).to.not.be.null);
      captureCsrf(pm.response.text());
    language: text/javascript
settings:
  followRedirects: false
order: 13000
