$kind: http-request
url: '{{base_url}}/accounts/password/reset/{{reset_uid}}/set-password/'
method: POST
description: |-
  Robustness BVA. nom = (max+ + min-) / 2, làm tròn 0.5 lên cho độ dài nguyên.

  Biến đang xét: password; độ dài: 129; vị trí: MAX+. Tag: X-RESET-PWD-MAX+, B-RESET-PWD-MAX+.

  Các biến còn lại giữ nominal: username=76, password=68, email=130, first_name=last_name=75 khi có trong form.

  Expected: từ chối, báo lỗi đúng trường và kiểm tra trạng thái sau yêu cầu. Mật khẩu cũ là dữ liệu xác thực của tài khoản setup, giữ nguyên; xác nhận mật khẩu mới bằng mật khẩu mới.
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    new_password1: '{{bva_new_password}}'
    new_password2: '{{bva_new_password}}'
scripts:
- type: beforeRequest
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-RESET-PWD-L129", "pfx": "rstpwd", "tag": "L129", "kind": "rst", "field": "password", "len": 129, "ok": false, "fields": ["new_password1", "new_password2"], "rx": "at most 128|(?:quá|đa) 128|128 (?:characters|ký tự)"};
    B.pre(CFG);
- type: afterResponse
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-RESET-PWD-L129", "pfx": "rstpwd", "tag": "L129", "kind": "rst", "field": "password", "len": 129, "ok": false, "fields": ["new_password1", "new_password2"], "rx": "at most 128|(?:quá|đa) 128|128 (?:characters|ký tự)"};
    B.test(CFG);
settings:
  followRedirects: false
order: 7000
