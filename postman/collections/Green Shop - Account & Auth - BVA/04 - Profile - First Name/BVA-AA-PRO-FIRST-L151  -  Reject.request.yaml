$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: POST
description: |-
  Robustness BVA. nom = (max+ + min-) / 2, làm tròn 0.5 lên cho độ dài nguyên.

  Biến đang xét: first_name; độ dài: 151; vị trí: MAX+. Tag: X-PRO-FIRST-MAX+, B-PRO-FIRST-MAX+.

  Các biến còn lại giữ nominal: username=76, password=68, email=130, first_name=last_name=75 khi có trong form.

  Expected: từ chối, báo lỗi đúng trường và kiểm tra trạng thái sau yêu cầu. Độ dài -1 không áp dụng; rỗng là min=0.
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    first_name: '{{bva_post_first}}'
    last_name: '{{bva_post_last}}'
    email: '{{bva_post_email}}'
scripts:
- type: beforeRequest
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-PRO-FIRST-L151", "pfx": "profirst", "tag": "L151", "kind": "pro", "field": "first_name", "len": 151, "ok": false, "fields": ["first_name"], "rx": "at most 150|(?:quá|đa) 150|150 (?:characters|ký tự)"};
    B.pre(CFG);
- type: afterResponse
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-PRO-FIRST-L151", "pfx": "profirst", "tag": "L151", "kind": "pro", "field": "first_name", "len": 151, "ok": false, "fields": ["first_name"], "rx": "at most 150|(?:quá|đa) 150|150 (?:characters|ký tự)"};
    B.test(CFG);
settings:
  followRedirects: false
order: 7000
