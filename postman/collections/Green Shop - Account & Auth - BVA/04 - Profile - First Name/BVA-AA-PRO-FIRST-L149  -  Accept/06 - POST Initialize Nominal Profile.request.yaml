$kind: http-request
url: '{{base_url}}/accounts/profile/edit/'
method: POST
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    first_name: '{{bva_first_name}}'
    last_name: '{{bva_last_name}}'
    email: '{{bva_email}}'
scripts:
  - type: afterResponse
    code: |-
      function locationPath() { const loc=pm.response.headers.get('Location')||''; return loc.replace(/^https?:\/\/[^/]+/i,'').split('?')[0]; }
      pm.test('HTTP 302',()=>pm.response.to.have.status(302)); pm.test('Đúng trang chuyển hướng',()=>pm.expect(locationPath()).to.eql("/accounts/profile/"));
    language: text/javascript
settings:
  followRedirects: false
order: 6000
