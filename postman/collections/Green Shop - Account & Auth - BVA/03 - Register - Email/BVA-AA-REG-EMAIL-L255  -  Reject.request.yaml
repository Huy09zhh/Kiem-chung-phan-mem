$kind: http-request
url: '{{base_url}}/accounts/register/'
method: POST
description: "Robustness BVA. nom = (max+ + min-) / 2, làm tròn 0.5 lên cho độ dài nguyên.\n\nBiến đang xét: email; độ dài: 255; vị trí: MAX+. Tag: X-REG-EMAIL-MAX+, B-REG-EMAIL-MAX+.\n\nCác biến còn lại giữ nominal: username=76, password=68, email=130, first_name=last_name=75 khi có trong form.\n\nExpected: từ chối, báo lỗi đúng trường và kiểm tra trạng thái sau yêu cầu. "
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    email: '{{bva_email}}'
    password1: '{{bva_password}}'
    password2: '{{bva_password}}'
scripts:
- type: beforeRequest
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-REG-EMAIL-L255", "pfx": "regmail", "tag": "L255", "kind": "reg", "field": "email", "len": 255, "ok": false, "fields": ["email"], "rx": "at most 254|(?:quá|đa) 254|254 (?:characters|ký tự)"};
    B.pre(CFG);
- type: afterResponse
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-REG-EMAIL-L255", "pfx": "regmail", "tag": "L255", "kind": "reg", "field": "email", "len": 255, "ok": false, "fields": ["email"], "rx": "at most 254|(?:quá|đa) 254|254 (?:characters|ký tự)"};
    B.test(CFG);
settings:
  followRedirects: false
order: 7000
