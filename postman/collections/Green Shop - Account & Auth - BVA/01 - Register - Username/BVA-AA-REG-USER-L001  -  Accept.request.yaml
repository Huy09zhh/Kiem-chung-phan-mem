$kind: http-request
url: '{{base_url}}/accounts/register/'
method: POST
description: "Robustness BVA. nom = (max+ + min-) / 2, làm tròn 0.5 lên cho độ dài nguyên.\n\nBiến đang xét: username; độ dài: 1; vị trí: MIN. Tag: V-REG-USER-MIN, B-REG-USER-MIN.\n\nCác biến còn lại giữ nominal: username=76, password=68, email=130, first_name=last_name=75 khi có trong form.\n\nExpected: chấp nhận và lưu đúng giá trị. "
body:
  type: urlencoded
  content:
    csrfmiddlewaretoken: '{{bva_csrf}}'
    username: '{{bva_user}}'
    email: '{{bva_email}}'
    password1: '{{bva_password}}'
    password2: '{{bva_password}}'
scripts:
- type: beforeRequest
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-REG-USER-L001", "pfx": "regusr", "tag": "L001", "kind": "reg", "field": "username", "len": 1, "ok": true, "fields": ["username"]};
    B.pre(CFG);
- type: afterResponse
  code: |-
    const B = eval(pm.collectionVariables.get('bva_lib'));   // thư viện dùng chung, xem biến bva_lib
    const CFG = {"id": "BVA-AA-REG-USER-L001", "pfx": "regusr", "tag": "L001", "kind": "reg", "field": "username", "len": 1, "ok": true, "fields": ["username"]};
    B.test(CFG);
settings:
  followRedirects: false
order: 2000
